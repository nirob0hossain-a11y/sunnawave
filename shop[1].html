<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Sunnah Wave</title>
  <meta name="description" content="Browse organic food, Islamic lifestyle products and books at Sunnah Wave.">
  <meta name="theme-color" content="#2c5e3b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,50;1,9..144,300..700,50&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><span id="crumb">Shop</span></nav>
        <h1 id="shop-title">All products</h1>
        <div class="bn" id="shop-bn">সব পণ্য</div>
        <p id="shop-tagline">Pure food, Sunnah essentials and beneficial knowledge — all in one place.</p>
      </div>
    </section>

    <div class="shop-bar">
      <div class="container">
        <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
        <div class="shop-tools">
          <span class="result-count" id="result-count"></span>
          <label class="sr-only" for="sort">Sort by</label>
          <select class="select" id="sort">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="rating">Top rated</option>
          </select>
        </div>
      </div>
    </div>

    <section class="container" style="padding-bottom:3rem">
      <p class="search-note hidden" id="search-note"></p>
      <div class="product-grid" id="grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/js/products.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
